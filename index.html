<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penta Court · Living Courtyard</title><style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8f4;color:#294235}.boot{min-height:100dvh;display:grid;place-items:center;padding:22px}.boot-inner{max-width:410px;text-align:center}.boot b{font-size:21px}.boot p{color:#6f7d70}.track{height:3px;background:#dfe7db;border-radius:8px;overflow:hidden;margin:18px 0}.track i{display:block;height:100%;background:#6a9879;width:0%;transition:width .2s}.links a{color:#3d7256;font-size:12px;margin:0 6px}#error{color:#994e4e;font-size:13px}
</style></head><body><main class="boot"><div class="boot-inner"><b>Penta Court</b><p id="msg">Opening the 3D living courtyard…</p><div class="track"><i id="bar"></i></div><p id="error" role="alert"></p><div class="links"><a href="activities.html">Spatial activities</a><a href="Penta_Court_Viewer%20%284%29.html">Standalone 3D viewer</a></div></div></main>
<script>
(async function(){
const msg=document.getElementById('msg'),bar=document.getElementById('bar'),err=document.getElementById('error');
const base='./Penta_Court_Viewer%20%284%29.html';
const fallback='https://raw.githubusercontent.com/Memortal/Penta-Court/main/Penta_Court_Viewer%20%284%29.html';
try{
 let response=await fetch(base,{cache:'no-store'});
 if(!response.ok){msg.textContent='Trying the GitHub source…';response=await fetch(fallback,{cache:'no-store'})}
 if(!response.ok)throw Error('Model file unavailable (HTTP '+response.status+').');
 const total=Number(response.headers.get('Content-Length'))||0;let source='';
 if(response.body&&typeof TextDecoder!=='undefined'){
  const reader=response.body.getReader(),decoder=new TextDecoder();let count=0;
  for(;;){const {done,value}=await reader.read();if(done)break;count+=value.byteLength;source+=decoder.decode(value,{stream:true});
   bar.style.width=Math.min(95,total?(count/total)*95:count/26000000*90)+'%';
  }
  source+=decoder.decode();
 }else source=await response.text();
 if(!source.includes('PentaGrowth')||!source.includes('PENTA'))throw Error('Model response incomplete.');
 msg.textContent='Preparing the interactive courtyard…';bar.style.width='100%';
 source=source.replace('</style><header>','</style><link rel="stylesheet" href="immersive.css"><header>');
 const closing='</scr'+'ipt>';
 source=source.replace(closing+'</html>',closing+'<script defer src="immersive.js">'+closing+'</html>');
 document.open();document.write(source);document.close();
}catch(e){console.error('Penta Court startup failed',e);msg.textContent='The 3D model could not open.';err.textContent=e.message+' Open the activity library or try the standalone viewer.';bar.style.width='0%'}
})();
</script></body></html>
